apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-dag-processor
  namespace: airflow
  labels:
    app: airflow-dag-processor
    component: dag-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-dag-processor
      component: dag-processor
  template:
    metadata:
      labels:
        app: airflow-dag-processor
        component: dag-processor
    spec:
      containers:
          - name: dag-processor
            image: {{ .Values.airflow.image.repository }}:{{ .Values.airflow.image.tag }}
            command:
              - bash
              - -c
              - "exec airflow dag-processor"
            envFrom:
              - configMapRef:
                  name: airflow-config