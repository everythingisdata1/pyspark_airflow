apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-triggerer
  namespace: airflow
  labels:
    app: airflow-triggerer
    component: triggerer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-triggerer
      component: triggerer
  template:
    metadata:
      labels:
        app: airflow-triggerer
        component: triggerer
    spec:
      securityContext:
        runAsUser: 50000
        fsGroup: 50000
      volumes:
        {{- include "airflow.dags.volume" . | nindent 8 }}
      containers:
        - name: triggerer
          image: {{ .Values.airflow.image.repository }}:{{ .Values.airflow.image.tag }}
          command:
            - bash
            - -c
            - "exec airflow triggerer"
          envFrom:
            - configMapRef:
                name: airflow-config
          volumeMounts:
              {{- include "airflow.dags.volumeMount" . | nindent 12 }}